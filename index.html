
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengaluru through your letters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#f8f5f0',
              ink: '#1a1a1a',
              terracotta: '#cc543a',
              forest: '#2d5a27',
              ochre: '#d4a017',
              sky: '#7fb3d5',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Sans+Kannada:wght@300;400;700&family=Noto+Sans+Bengali:wght@300;400;700&family=Noto+Sans+Odia:wght@300;400;700&family=Noto+Sans+Gujarati:wght@300;400;700&family=Noto+Sans+Gurmukhi:wght@300;400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Malayalam:wght@400;700&family=Noto+Sans+Ol+Chiki:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Architects+Daughter&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-paper: #f8f5f0;
            --color-ink: #1a1a1a;
            --color-terracotta: #cc543a;
            --color-forest: #2d5a27;
            --color-ochre: #d4a017;
            --color-sky: #7fb3d5;
        }

        body {
            background-color: var(--color-paper);
            color: var(--color-ink);
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .devanagari { font-family: 'Noto Sans Devanagari', sans-serif; }
        .kannada { font-family: 'Noto Sans Kannada', sans-serif; }
        .bengali { font-family: 'Noto Sans Bengali', sans-serif; }
        .odia { font-family: 'Noto Sans Odia', sans-serif; }
        .gujarati { font-family: 'Noto Sans Gujarati', sans-serif; }
        .gurmukhi { font-family: 'Noto Sans Gurmukhi', sans-serif; }
        .telugu { font-family: 'Noto Sans Telugu', sans-serif; }
        .malayalam { font-family: 'Noto Sans Malayalam', sans-serif; }
        .olchiki { font-family: 'Noto Sans Ol Chiki', sans-serif; }
        .urdu { font-family: 'Noto Nastaliq Urdu', serif; }
        .serif { font-family: 'Crimson Pro', serif; }
        .handwritten { font-family: 'Architects Daughter', cursive; }
        
        .zine-texture {
            background-image: url("https://www.transparenttextures.com/patterns/recycled-paper-texture.png");
        }
        
        .grain-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.05;
            z-index: 999;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
        }

        .brutalist-shadow {
            box-shadow: 6px 6px 0px 0px var(--color-ink);
        }
        
        .brutalist-shadow-sm {
            box-shadow: 3px 3px 0px 0px var(--color-ink);
        }

        .brutalist-shadow-lg {
            box-shadow: 10px 10px 0px 0px var(--color-ink);
        }

        .tape {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0,0,0,0.05);
            transform: rotate(-2deg);
            z-index: 10;
        }

        @keyframes wobble {
            0% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
            100% { transform: rotate(-1deg); }
        }
        .animate-wobble { animation: wobble 3s ease-in-out infinite; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--color-ink); }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 2px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="zine-texture">
    <div id="root"></div>
    <div class="grain-overlay"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
